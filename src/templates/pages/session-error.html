<!-- Fullscreen Session Error Overlay -->
<section id="page-session-error" class="page-overlay session-error-page hidden" aria-label="Ошибка сессии" role="dialog" aria-modal="true">
  <div class="session-error-container">
    <div class="session-error-card">
      <div class="session-error-icon-box">
        <span class="session-error-emoji" id="sessionErrorEmoji" aria-hidden="true">📡</span>
      </div>
      <h2 class="session-error-title" id="sessionErrorTitle">Связь с GhostLink прервана</h2>
      <p class="session-error-desc" id="sessionErrorDesc">
        Не удалось установить защищённую сессию. Проверьте интернет-соединение и нажмите «Перезапустить».
      </p>
      <div class="session-error-actions">
        <button class="session-error-btn-retry" id="btnSessionRetry" type="button">
          Перезапустить
        </button>
      </div>
    </div>
  </div>
</section>
