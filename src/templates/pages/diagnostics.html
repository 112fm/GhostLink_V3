<!-- Service-only view: visible exclusively with ?diagnostics=1. -->

  <div class="diagnostics-page-content">
    <div class="diagnostics-header">
      <p class="diagnostics-eyebrow">GHOSTLINK V3</p>
      <h1>Проверка запуска</h1>
      <p>Здесь нет токенов, имени, тарифа или других данных профиля.</p>

      <div class="diagnostics-row"><dt>Профиль</dt><dd id="diagnostics-user">Не начато</dd></div>
      <div class="diagnostics-row"><dt>Тарифы</dt><dd id="diagnostics-tariffs">Не начато</dd></div>
