      <!-- Вкладка: Настройки -->

           ВКЛАДКА НИЖНЕЙ НАВИГАЦИИ: настройки и управление аккаунтом.

      <section id="tab-settings" class="tab-content">
        <div class="settings-container">

                </div>
                <div class="settings-clean-right">
                  <svg class="settings-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>

                    <span class="settings-clean-label">Управление Клубом</span>

                </div>
                <div class="settings-clean-right">
                  <svg class="settings-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>

              <div class="settings-clean-row" style="cursor: default;">
                <div class="settings-clean-left">

                    <img src="./assets/icons/tg.svg" alt="Telegram" style="width: 20px; height: 20px; object-fit: contain;" />

                  <div class="settings-clean-info">
                    <span class="settings-clean-label">Telegram</span>
                    <span class="settings-clean-sub">Основной способ входа</span>
                  </div>
                </div>
                <div class="settings-clean-right">
                  <div class="status-badge-connected">
                    <span class="status-badge-dot"></span>
                    <span>Подключено</span>
                  </div>
                </div>
              </div>

                </div>
              </div>

          <div class="settings-app-footer">
