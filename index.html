<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111211" />
    <title>GhostLink — приложение временно отключено</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #111211; color: #f5f5f5; }
      main { box-sizing: border-box; width: min(100% - 32px, 520px); padding: 32px 24px; border: 1px solid #343634; border-radius: 20px; background: #191b19; }
      h1 { margin: 0 0 20px; font-size: 28px; }
      p { color: #c9ccc9; line-height: 1.55; }
      .status { margin: 24px 0 0; padding: 14px 16px; border-radius: 12px; background: #242724; }
    </style>
  </head>
  <body>
    <main>
      <h1>GhostLink 👻</h1>
      <p>Mini App временно отключён. Мы переносим управление ключами, подпиской и оплатой в чат с ботом.</p>
      <p class="status">Уже настроенное подключение продолжит работать. Если нужна помощь, вернись в чат GhostLink и отправь <b>/start</b>.</p>
    </main>
  </body>
</html>
